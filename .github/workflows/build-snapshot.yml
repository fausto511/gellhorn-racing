name: Build data snapshot

# DEC-0045: /time-attack/ and the Gellhorn track page need a schedule- plus
# webhook-triggered rebuild so they ship real, current leaderboard data as
# static HTML, not purely client-side-loaded data.
#
# Three triggers:
#   - schedule: every 20 minutes, safety-net refresh.
#   - repository_dispatch (type: leaderboard-updated): fired by a Supabase
#     database webhook on relevant status changes, once that webhook is
#     configured against a real Supabase project (not yet — see
#     SETUP-BACKEND.md).
#   - workflow_dispatch: manual trigger for testing.
#
# Until SUPABASE_URL / SUPABASE_ANON_KEY repository secrets exist, the fetch
# script no-ops cleanly (see scripts/fetch-leaderboard-data.mjs) so this
# workflow stays green rather than failing on a decision that hasn't been
# made yet (no Supabase project created, DEC pending on site/ vs gellhorn-v2).

on:
  schedule:
    - cron: "*/20 * * * *"
  repository_dispatch:
    types: [leaderboard-updated]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch public leaderboard snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/fetch-leaderboard-data.mjs

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- site/src/data/leaderboard-snapshot.json 2>/dev/null; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "gellhorn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/src/data/leaderboard-snapshot.json
          git commit -m "chore: refresh leaderboard snapshot"
          git push
