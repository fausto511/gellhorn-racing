name: Supabase keep-alive

# Free Supabase projects are paused after 1 week without activity
# (supabase.com/pricing, Stand 2026-09). This pings the REST API every
# 3 days so the backend stays up before launch (RS-0028, DEC-0070).
# Uses the same repo secrets as deploy-pages.yml — nothing new to set up.
# Note: GitHub disables scheduled workflows after 60 days without any
# repository activity; a normal push re-enables them.

on:
  schedule:
    - cron: '23 5 */3 * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/tracks?select=track_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          test "$code" = "200"
